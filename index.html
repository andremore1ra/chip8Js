<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHIP-8 Emulator</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <header>
    	<h1>CHIP-8 Emulator</h1>
        <button id="config-btn">⚙</button>
    </header>

    <main class="container">
        <section class="video">
            <canvas id="screen" width="64" height="32" role="img"></canvas>
        </section>

        <section class="controls">
            <div class="buttons">
                <label class="upload" for="rom-upload">
                    <input type="file" id="rom-upload" accept=".ch8">
                    <span>LOAD ROM</span>
                </label>

                <button id="reset-rom">RESET</button>
                <button id="pause-rom">PAUSE</button>
            </div>

            <div class="speed-control">
                <span>Speed</span>
                <input type="range" id="speed" min="10" max="200" value="10">
        		<span id="speed-value">600 Hz</span>
    	    </div>
        </section>

        <!-- Mobile keypad -->
        <section class="keypad" id="keypad">
            <button data-key="1">1</button>
            <button data-key="2">2</button>
            <button data-key="3">3</button>
            <button data-key="C">C</button>

            <button data-key="4">4</button>
            <button data-key="5">5</button>
            <button data-key="6">6</button>
            <button data-key="D">D</button>

            <button data-key="7">7</button>
            <button data-key="8">8</button>
            <button data-key="9">9</button>
            <button data-key="E">E</button>

            <button data-key="A">A</button>
            <button data-key="0">0</button>
            <button data-key="B">B</button>
            <button data-key="F">F</button>
        </section>
    </main>

    <!-- Configuration modal -->
    <div id="config-overlay">
    	<div class="config-panel">

        	<h2>CONFIG</h2>

            <div class="rom-info" style="margin-bottom: 15px; font-size: 0.9rem;">
                <span>ROM: </span><strong id="rom-name">NONE</strong>
            </div>

        	<h3>QUIRKS</h3>

        	<label>
            	VF Reset
            	<input type="checkbox" id="vfReset">
        	</label>

        	<label>
            	Memory
            	<input type="checkbox" id="memory">
        	</label>

        	<label>
            	Clip
            	<input type="checkbox" id="clip">
        	</label>

        	<label>
            	Jump
            	<input type="checkbox" id="jump">
        	</label>

        	<label>
            	Shift
            	<input type="checkbox" id="shift">
        	</label>

            <label>
                Disp Wait
                <input type="checkbox" id="dispWait">
            </label>

        	<button id="close-config">CLOSE</button>
		</div>
	</div>
    </div>

    <footer>
        <p>Built by André Moreira <a href="https://github.com/moreirandre/chip8Js" target="_blank">GitHub</a></p>
    </footer>

    <script type="module" src="main.js"></script>
    <script>
        if ("serviceWorker" in navigator)
            navigator.serviceWorker.register("./sw.js");
    </script>
</body>
</html>
